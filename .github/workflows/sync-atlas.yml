name: Sync skill atlas to live site

on:
  push:
    branches: [main]
    paths:
      - docs/skill-atlas.html
      - docs/skills-index.js
      - src/**
      - public/**
      - scripts/prepare-public.mjs
      - next.config.mjs
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/sync-atlas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-atlas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the site under /skillpack
        run: |
          set -euo pipefail
          npm ci
          PAGES_BASE_PATH=/skillpack npm run build

      - name: Copy the built site into the site repository and push
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/kamalsoft/kamalsoft.github.io.git" site
          rm -rf site/skillpack
          mkdir -p site/skillpack
          cp -R out/. site/skillpack/
          # GitHub Pages runs Jekyll, which skips folders starting with an underscore (_next). This file turns it off.
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skillpack .nojekyll
          if git diff --cached --quiet; then
            echo "Live site already matches this build"
            exit 0
          fi
          git commit -m "Sync skill atlas from kamalsoft/skill-pack@${GITHUB_SHA::7}"
          git push origin HEAD:main
