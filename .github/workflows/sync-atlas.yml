name: Sync skill atlas to live site

on:
  push:
    branches: [main]
    paths:
      - docs/skill-atlas.html
      - docs/skills-index.js
      - .github/workflows/sync-atlas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-atlas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Copy the page and the skill index into the site repository and push
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/kamalsoft/kamalsoft.github.io.git" site
          cp docs/skill-atlas.html site/skillpack/index.html
          cp docs/skills-index.js site/skillpack/skills-index.js
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillpack/index.html skillpack/skills-index.js
          if git diff --cached --quiet; then
            echo "Live page already matches docs/skill-atlas.html"
            exit 0
          fi
          git commit -m "Sync skill atlas from kamalsoft/skill-pack@${GITHUB_SHA::7}"
          git push origin HEAD:main
